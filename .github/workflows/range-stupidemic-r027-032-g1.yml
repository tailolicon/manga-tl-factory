name: Render stupidemic range 027-032 g1

on:
  push:
    branches:
      - chapter/stupidemic-ch1/r027-032/g1
    paths:
      - .github/workflows/range-stupidemic-r027-032-g1.yml

permissions:
  contents: write
  actions: read

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapter/stupidemic-ch1/r027-032/g1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: python -m pip install --quiet pillow opencv-python-headless numpy
      - name: Download pinned chapter relay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p relay
          gh run download 33198730435 \
            --repo "$GITHUB_REPOSITORY" \
            --name chapter-relay-stupidemic-ch1-ch-200c8c840df0 \
            --dir relay
          test -f relay/ch-200c8c840df0/0027.jpg
          test -f relay/ch-200c8c840df0/0032.jpg
      - name: Render publication-size pages
        env:
          RELAY_DIR: ${{ github.workspace }}/relay/ch-200c8c840df0
          OUT_DIR: ${{ github.workspace }}/projects/mangadistrict-com-title-stupidemic-uncensored/chapters/ch-200c8c840df0/rendered
        run: |
          python work/renderers/stupidemic-r027-032-g1.py | tee /tmp/render-manifest.json
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('projects/mangadistrict-com-title-stupidemic-uncensored/chapters/ch-200c8c840df0/rendered')
          for p in range(27,33):
              f=root/f'page-{p:03d}.webp'
              assert f.is_file() and f.stat().st_size > 80000, (p, f.stat().st_size if f.exists() else None)
              with Image.open(f) as im:
                  assert im.size == (720,5000), (p,im.size)
          PY
      - name: Commit exact binary pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/range-stupidemic-r027-032-g1.yml work/renderers/stupidemic-r027-032-g1.py
          git add projects/mangadistrict-com-title-stupidemic-uncensored/chapters/ch-200c8c840df0/rendered/page-0{27,28,29,30,31,32}.webp
          git commit -m 'localize stupidemic ch1 pages 027-032'
          git push origin HEAD:chapter/stupidemic-ch1/r027-032/g1
