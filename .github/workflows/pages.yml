name: Deploy Manga Reader

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/build_site_index.py"
      - "manga_factory/**"
      - "tests/**"
      - "config/**"
      - "contracts/**"
      - "CHAPTER_PIPELINE.md"
      - "WORKER_START.md"
      - "WORKER_PROTOCOL.md"
      - "projects/**/project.json"
      - "projects/**/publication/**"
      - "work/chapter_lanes/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate, build & deploy reader
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate repository
        run: python -m manga_factory validate

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build library index
        run: python scripts/build_site_index.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
