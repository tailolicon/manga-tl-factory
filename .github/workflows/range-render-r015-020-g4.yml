name: Range render r015-020 g4

on:
  push:
    branches:
      - chapter/stupidemic-ch1/r015-020/g4
    paths:
      - .github/workflows/range-render-r015-020-g4.yml

permissions:
  contents: write
  actions: read

jobs:
  render-and-persist:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout range branch
        uses: actions/checkout@v4
        with:
          ref: chapter/stupidemic-ch1/r015-020/g4
          fetch-depth: 0

      - name: Download chapter relay
        uses: actions/download-artifact@v4
        with:
          name: chapter-relay-stupidemic-ch1-ch-200c8c840df0
          path: relay
          github-token: ${{ github.token }}
          repository: tailolicon/manga-tl-factory
          run-id: 33198730435

      - name: Install pinned rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install 'Pillow==12.3.0' 'numpy==2.3.5' 'opencv-python-headless==4.13.0.92'

      - name: Reproduce exact visually accepted candidates
        run: |
          rm -rf /mnt/data/stupidemic-relay /mnt/data/rendered-r015-020-v4 generated
          ln -s "$GITHUB_WORKSPACE/relay" /mnt/data/stupidemic-relay
          python work/handoffs/chapter-stupidemic-ch1-r015-020-g1-recipe.py
          mkdir -p generated
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          src=Path('/mnt/data/rendered-r015-020-v4')
          out=Path('generated')
          expected={
            15:'c096239bc1273b0a398cc38bb74ea9bf247fd9ba5cd36a22bdd61c97a0ba72d1',
            16:'760e30560b75d5752915f78eae797de70ba91a309d81c92b37b47347d755303c',
            17:'47add37485c683476b172cd3ff85be1dc7e5240a18c89fca87c5fe8fd2328039',
            18:'3d5919f7c60b4022248331b619f305cf61559c38afb0086d630b4edbb83dc646',
            19:'f008ac5f880293cbe71e013765203e0bd9be05a8d9d5f009ce76cc455d361994',
            20:'985abbfe49999c598bec88bb2e2300bf0dc217601042d74a78850de3531e08ad',
          }
          for p in range(15,21):
              inp=src/f'page-{p:03d}.webp'; dst=out/f'page-{p:03d}.webp'
              with Image.open(inp) as im:
                  im.convert('RGB').save(dst,'WEBP',quality=55,method=6)
              with Image.open(dst) as im:
                  assert im.size==(720,5000),(p,im.size)
              got=hashlib.sha256(dst.read_bytes()).hexdigest()
              print(p,dst.stat().st_size,got)
              assert got==expected[p],(p,got,expected[p])
          PY
          dest=projects/mangadistrict-com-title-stupidemic-uncensored/chapters/ch-200c8c840df0/rendered
          mkdir -p "$dest"
          cp generated/page-0{15,16,17,18,19,20}.webp "$dest"/

      - name: Commit exact binary pages
        run: |
          git config user.name 'manga-tl-factory worker'
          git config user.email 'actions@users.noreply.github.com'
          git add projects/mangadistrict-com-title-stupidemic-uncensored/chapters/ch-200c8c840df0/rendered/page-0{15,16,17,18,19,20}.webp
          git commit -m 'render stupidemic ch1 r015-020 g4 [skip ci]'
          git push origin HEAD:chapter/stupidemic-ch1/r015-020/g4
          echo "PAGE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Write completed range result and handoff
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          from PIL import Image
          page_commit=os.environ['PAGE_COMMIT']
          base=Path('projects/mangadistrict-com-title-stupidemic-uncensored/chapters/ch-200c8c840df0/rendered')
          artifacts=[]
          for p in range(15,21):
              path=base/f'page-{p:03d}.webp'; rel=path.as_posix()
              blob=subprocess.check_output(['git','rev-parse',f'{page_commit}:{rel}'],text=True).strip()
              data=path.read_bytes()
              with Image.open(path) as im: width,height=im.size
              artifacts.append({'page_index':p,'path':rel,'git_blob_sha':blob,'sha256':hashlib.sha256(data).hexdigest(),'width':width,'height':height,'durable_branch_commit':page_commit,'qa_status':'accepted'})
          result={
            'schema':1,'status':'completed','task_id':'chapter-stupidemic-ch1-r015-020-g4','task_type':'localize_chapter_range',
            'lease_id':'chapter-lane-stupidemic-ch1-r015-020-g4','fencing_token':4,
            'project_id':'mangadistrict-com-title-stupidemic-uncensored','chapter_id':'ch-200c8c840df0',
            'page_start':15,'page_end':20,'branch':'chapter/stupidemic-ch1/r015-020/g4','context_version':'smoke:no-canonical-context',
            'completed_unit':'redraw_typeset_qa-pages-015-020','binary_commit':page_commit,
            'qa':{'status':'accepted','pages':6,'visual_inspection':'exact 720x5000 quality-55 bytes reproduce generation-3 visually accepted candidates; all six SHA-256 values asserted before persistence'},
            'artifacts':artifacts
          }
          handoff={'schema':1,'status':'completed','task_id':'chapter-stupidemic-ch1-r015-020-g4','task_type':'localize_chapter_range','lease_id':'chapter-lane-stupidemic-ch1-r015-020-g4','fencing_token':4,'branch':'chapter/stupidemic-ch1/r015-020/g4','phase':'done','resume_page':21,'page_start':15,'page_end':20,'page_commit':page_commit,'result_path':'work/results/chapter-stupidemic-ch1-r015-020-g4.json','context_version':'smoke:no-canonical-context'}
          rp=Path('work/results/chapter-stupidemic-ch1-r015-020-g4.json'); hp=Path('work/handoffs/chapter-stupidemic-ch1-r015-020-g4.json')
          rp.parent.mkdir(parents=True,exist_ok=True); hp.parent.mkdir(parents=True,exist_ok=True)
          rp.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); hp.write_text(json.dumps(handoff,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add work/results/chapter-stupidemic-ch1-r015-020-g4.json work/handoffs/chapter-stupidemic-ch1-r015-020-g4.json
          git commit -m 'record stupidemic ch1 r015-020 g4 result [skip ci]'
          git push origin HEAD:chapter/stupidemic-ch1/r015-020/g4
