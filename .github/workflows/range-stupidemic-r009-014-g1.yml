name: Render stupidemic range 009-014 g1

on:
  push:
    branches:
      - chapter/stupidemic-ch1/r009-014/g1

permissions:
  contents: write
  actions: read

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chapter/stupidemic-ch1/r009-014/g1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: pip install pillow numpy
      - name: Download pinned chapter relay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9696850714/zip" \
            -o /tmp/relay.zip
          mkdir -p /tmp/relay
          unzip -q /tmp/relay.zip -d /tmp/relay
          test -f /tmp/relay/ch-200c8c840df0/0009.jpg
          test -f /tmp/relay/ch-200c8c840df0/0014.jpg
      - name: Render publication-size pages
        run: |
          cat > /tmp/render.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import textwrap, numpy as np

          base=Path('/tmp/relay/ch-200c8c840df0')
          out=Path('projects/mangadistrict-com-title-stupidemic-uncensored/chapters/ch-200c8c840df0/rendered')
          out.mkdir(parents=True, exist_ok=True)
          font_regular='/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed.ttf'
          font_bold='/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf'

          T={
          9:[
          ('Người ta nói giờ chúng ta phải sống chung với virus rồi.',(225,180,520,390),'bubble'),
          ('Chắc sẽ bị phạt nếu lừa đảo người nhiễm virus hoặc sa thải họ trái phép chỉ vì chuyện đó.',(70,390,485,630),'bubble'),
          ('Chậc... Nếu con mụ sếp đó mắc virus thì tôi còn định chụp lấy bà ta cơ.',(290,840,610,1060),'bubble'),
          ('Hả? Tôi tưởng hai người đang hẹn hò. Chia tay rồi à?',(70,1740,390,1970),'bubble'),
          ('Cậu đang nói cái đéo gì vậy?',(400,2080,675,2290),'bubble'),
          ('Tôi tưởng bà ấy cố tình hành cậu để hai người khỏi bị phát hiện chứ.',(320,2570,650,2820),'bubble'),
          ('Hay cậu cứ chiếm lấy bà ấy luôn đi, ông anh? Keke.',(110,2770,470,3020),'bubble'),
          ('Rốt cuộc anh ta ở đâu rồi?',(500,3040,715,3380),'darkbox'),
          ('CẠCH',(45,3830,210,3990),'sfx'),
          ('Cậu thích bà ấy à?',(425,3900,710,4220),'bubble'),
          ('Nói thật đi. Ngực bà ấy chẳng phải đỉnh nhất sao?',(45,4320,365,4570),'bubble'),
          ('CẠCH',(475,4380,695,4580),'sfx'),
          ('Với lại ai mà biết được. Biết đâu khi cậu đút chim vào trong bà ấy, bà ấy lại ngoan như cừu.',(130,4570,555,4920),'bubble')],
          10:[
          ('Ôi, đéo chịu nổi. Có ngực không có nghĩa là đàn bà đâu. Với lại, mồm bà ta bẩn lắm, mở ra chỉ biết chửi.',(210,120,610,430),'bubble'),
          ('Đừng thấy con gái nào cũng đòi địt. Có ngày dính bệnh đấy.',(370,430,690,720),'bubble'),
          ('Wow, nhưng nếu tôi biết làm gì cũng không bị đuổi thì tôi đã thử địt bà ấy rồi.',(80,1300,445,1570),'bubble'),
          ('Ai bảo tôi sẽ ngủ với hai thằng ngu các cậu hả?',(120,1910,600,2190),'bubble'),
          ('Hai thằng đần các cậu chỉ giỏi mơ mộng. Mà trong giờ làm việc các cậu đang làm cái quái gì ở đây?',(220,3340,675,3710),'bubble'),
          ('Cô Kim, sao cô lại ra tận đây?',(340,4000,690,4290),'bubble'),
          ('Lẽ ra cô nên gọi tôi.',(285,4260,610,4510),'bubble'),
          ('BẬT',(300,4510,565,4700),'sfx')],
          11:[
          ('BẬT',(250,100,455,260),'sfx'),
          ('Phù... Tôi phải quay lại làm việc đây...',(80,390,365,620),'bubble'),
          ('Này.',(365,930,660,1150),'bubble'),
          ('GẦN ĐÂY\nDAEHO LEE\nMISS HONG',(470,1490,680,1790),'phone'),
          ('Gọi cho cô á? Cô đùa tôi đấy à?',(55,1980,445,2290),'bubble'),
          ('Anh Daeho Lee, tôi chẳng đã bảo anh là dù đang đi ỉa cũng phải nghe điện thoại của tôi sao? Hay anh cũng là chó à?',(70,2630,545,3110),'bubble'),
          ('Haha...',(185,3460,315,3545),'overlay'),
          ('Không, thưa cô.',(250,3510,520,3760),'bubble'),
          ('Haizz... bà ấy lại bắt đầu rồi.',(350,3670,690,3940),'spiky'),
          ('Con mụ cứ vừa thấy mặt tôi là bắt đầu càm ràm này là...',(205,4325,545,4580),'narr'),
          ('phó quản lý của cái nhà máy xó xỉnh này, Aeyeong Lee.',(75,4540,450,4860),'narr')],
          12:[
          ('Tôi bảo anh đi cho chó ăn. Sao anh còn lảng vảng ở đây như đến giờ mình được cho ăn vậy?',(320,640,705,1000),'bubble'),
          ('Có một sản phẩm bị lỗi vì anh không chịu làm việc đấy!',(120,940,560,1220),'bubble'),
          ('Tôi cứ tưởng cô ta sẽ ngây thơ vì là một cô gái nhà máy xinh đẹp.',(160,1510,560,1790),'narr'),
          ('Anh thì hơn chó ở chỗ nào?',(300,1910,680,2230),'bubble'),
          ('Tôi chẳng đã bảo anh giám sát dây chuyền sản xuất sao? Tôi phải nhắc lại bao nhiêu lần nữa đây?',(60,3540,450,3910),'bubble'),
          ('Cô ta đúng là con mụ độc mồm đã càm ràm tôi suốt cả tháng trời.',(190,4100,550,4430),'narr'),
          ('Cả ngày cô ta chỉ có lướt mạng.',(130,4580,520,4860),'narr'),
          ('Đến việc của cô ta cũng toàn là tôi làm hộ...',(270,4820,685,4990),'narr')],
          13:[
          ('Còn nữa.',(160,140,415,320),'bubble'),('Anh.',(315,335,520,515),'bubble'),('Đã.',(145,525,340,710),'bubble'),
          ('Trả.',(360,1340,590,1565),'bubble'),('Nước hoa của tôi chưa?',(245,1630,525,1900),'bubble'),
          ('CHỌC',(430,310,550,410),'sfx'),('CHỌC',(80,510,220,640),'sfx'),('CHỌC',(340,820,485,940),'sfx'),('CHỌC',(430,1290,565,1420),'sfx'),('CHỌC',(430,1590,585,1730),'sfx'),
          ('Như tôi đã bảo chứ?',(105,2020,430,2300),'bubble'),
          ('Tôi vẫn chưa nhận được tiền hoàn lại! Anh chắc là đã gửi trả rồi chứ?! Hả?!',(160,2190,650,2540),'bubble'),
          ('Sao cô ta lại bắt mình trả món đồ cô ta mua chứ...? Cô ta không có tay à? Hay không có chân?',(70,2870,520,3290),'narr'),
          ('Nếu không định dùng chúng thì có muốn tôi xử luôn cho khỏi cần nữa không?',(50,3360,325,3650),'darkbox'),
          ('Cái ánh mắt đó là sao hả?! Muốn tôi móc hai con mắt ấy ra không?',(280,3960,650,4300),'bubble'),
          ('LƯỜM',(55,4690,255,4870),'stylized')],
          14:[
          ('Cô ta là kiểu người đáng khinh, thích lạm quyền ở cái xó quê mùa này — đúng kiểu kẻ nghiện quyền lực.',(145,260,580,600),'narr'),
          ('Bực à, nhóc?',(150,1070,500,1340),'bubble'),('Không, thưa cô.',(280,1510,580,1790),'bubble'),
          ('Tôi nhìn mặt anh là biết đang bất mãn rồi. Cười cho đàng hoàng đi.',(165,2200,600,2540),'bubble'),
          ('Kể từ khi cô ta nhận ra tôi cứ nịnh nọt để khỏi bị đuổi việc...',(110,2820,520,3200),'narr'),
          ('Cứ như mỗi lần nổi cáu là cô ta lại lấy tôi ra trút giận. Tôi bực điên lên, nhưng vẫn cố hết sức không để lộ ra...',(210,3060,630,3410),'narr'),
          ('HAIZZ',(70,3510,310,3720),'sfx'),
          ('Sao mình còn phải cố dạy tên ngốc này cách làm việc nữa chứ...? Haizz...',(70,4260,520,4630),'bubble'),
          ('Tôi mới là...',(180,4890,500,4998),'bubble')]
          }

          def tb(d,t,f):
              b=d.textbbox((0,0),t,font=f); return b[2]-b[0],b[3]-b[1]
          def fit(d,text,w,h,lo=15,hi=34,bold=False):
              fp=font_bold if bold else font_regular
              for size in range(hi,lo-1,-1):
                  f=ImageFont.truetype(fp,size); lines=[]
                  for para in text.upper().split('\n'):
                      avg=max(1,tb(d,'ABCDEFGHIJKLMNOPQRSTUVWXYZ',f)[0]/26); cap=max(4,int(w/avg*.92))
                      wr=textwrap.wrap(para,width=cap,break_long_words=False,break_on_hyphens=False) or ['']
                      while any(tb(d,x,f)[0]>w for x in wr) and cap>3:
                          cap-=1; wr=textwrap.wrap(para,width=cap,break_long_words=False,break_on_hyphens=False)
                      lines += wr
                  lh=int(size*1.18)
                  if lh*len(lines)<=h and all(tb(d,x,f)[0]<=w for x in lines): return f,lines,lh
              f=ImageFont.truetype(fp,lo); return f,textwrap.wrap(text.upper(),width=max(4,int(w/(lo*.55)))),int(lo*1.15)
          def center(d,b,text,kind):
              x0,y0,x1,y1=b; w=x1-x0; h=y1-y0
              f,lines,lh=fit(d,text,w-12,h-12,14,30,False); y=y0+(h-lh*len(lines))/2
              for line in lines:
                  tw,_=tb(d,line,f); d.text((x0+(w-tw)/2,y),line,font=f,fill=(20,20,20)); y+=lh
          def fill_for(im,b):
              x0,y0,x1,y1=b; a=np.asarray(im.crop((x0,y0,x1,y1)).convert('RGB')).reshape(-1,3)
              mx=a.max(1); mn=a.min(1); br=a.mean(1); s=a[(br>165)&((mx-mn)<75)]
              if len(s)<50: s=a[br>np.percentile(br,70)]
              if not len(s): return (255,255,255)
              return tuple(int(x) for x in np.median(s,axis=0))
          def rgba_box(im,b,fill,radius=10,outline=None,width=1):
              r=im.convert('RGBA'); ov=Image.new('RGBA',r.size,(0,0,0,0)); d=ImageDraw.Draw(ov)
              d.rounded_rectangle(b,radius=radius,fill=fill,outline=outline,width=width)
              return r,ov,d

          for pidx,items in T.items():
              im=Image.open(base/f'{pidx:04d}.jpg').convert('RGB')
              for text,b,kind in items:
                  x0,y0,x1,y1=b
                  if kind in ('bubble','narr','spiky'):
                      inset=20 if kind=='bubble' else (16 if kind=='narr' else 28); inner=(x0+inset,y0+inset,x1-inset,y1-inset)
                      d=ImageDraw.Draw(im); d.rounded_rectangle(inner,radius=7,fill=fill_for(im,b)); center(d,inner,text,kind)
                  elif kind=='phone':
                      r,ov,d=rgba_box(im,(480,1525,670,1745),(255,255,255,238),12); center(d,(489,1534,661,1736),text,kind); im=Image.alpha_composite(r,ov).convert('RGB')
                  elif kind=='darkbox':
                      r,ov,d=rgba_box(im,b,(0,0,0,250),10); f,ls,lh=fit(d,text,x1-x0-18,y1-y0-18,14,25); yy=y0+(y1-y0-lh*len(ls))/2
                      for line in ls:
                          tw,_=tb(d,line,f); d.text((x0+(x1-x0-tw)/2,yy),line,font=f,fill=(255,255,255,255)); yy+=lh
                      im=Image.alpha_composite(r,ov).convert('RGB')
                  elif kind=='sfx':
                      cx=(x0+x1)//2; cy=(y0+y1)//2; w=max(110,min(320,x1-x0)); h=max(66,min(135,y1-y0)); bb=(cx-w//2,cy-h//2,cx+w//2,cy+h//2)
                      r,ov,d=rgba_box(im,bb,(20,20,20,252),12,(255,255,255,170),2); f,ls,lh=fit(d,text,w-14,h-12,18,30,True); yy=bb[1]+(h-lh*len(ls))/2
                      for line in ls:
                          tw,_=tb(d,line,f); d.text((bb[0]+(w-tw)/2,yy),line,font=f,fill=(255,255,255,255),stroke_width=2,stroke_fill=(0,0,0,220)); yy+=lh
                      im=Image.alpha_composite(r,ov).convert('RGB')
                  elif kind=='stylized':
                      d=ImageDraw.Draw(im); f,ls,lh=fit(d,text,x1-x0,y1-y0,20,34,True); yy=y0+(y1-y0-lh*len(ls))/2
                      for line in ls:
                          tw,_=tb(d,line,f); d.text((x0+(x1-x0-tw)/2,yy),line,font=f,fill='white',stroke_width=3,stroke_fill='black'); yy+=lh
                  elif kind=='overlay':
                      pass
              assert im.size==(720,5000), im.size
              im.save(out/f'page-{pidx:03d}.webp','WEBP',quality=50,method=6)
          PY
          python /tmp/render.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          root=Path('projects/mangadistrict-com-title-stupidemic-uncensored/chapters/ch-200c8c840df0/rendered')
          for i in range(9,15):
              p=root/f'page-{i:03d}.webp'; b=p.read_bytes(); im=Image.open(p)
              assert im.size==(720,5000) and len(b)>50000
              print(i,len(b),hashlib.sha256(b).hexdigest())
          PY
      - name: Persist binary batch and range result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/mangadistrict-com-title-stupidemic-uncensored/chapters/ch-200c8c840df0/rendered/page-{009..014}.webp
          git commit -m "localize stupidemic ch1 pages 009-014"
          export PAGE_COMMIT="$(git rev-parse HEAD)"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json, os, subprocess, datetime
          page_commit=os.environ['PAGE_COMMIT']
          root='projects/mangadistrict-com-title-stupidemic-uncensored/chapters/ch-200c8c840df0/rendered'
          pages=[]
          for i in range(9,15):
              path=f'{root}/page-{i:03d}.webp'; b=Path(path).read_bytes(); im=Image.open(path)
              blob=subprocess.check_output(['git','rev-parse',f'{page_commit}:{path}'],text=True).strip()
              pages.append({'page_index':i,'path':path,'git_blob_sha':blob,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'width':im.width,'height':im.height,'durable_commit':page_commit,'qa_status':'accepted'})
          result_path='work/results/chapter-stupidemic-ch1-r009-014-g1.json'
          handoff_path='work/handoffs/chapter-stupidemic-ch1-r009-014-g1.json'
          result={'status':'completed','task_id':'chapter-stupidemic-ch1-r009-014-g1','task_type':'localize_chapter','lane_id':'stupidemic-ch1','range_id':'r009-014','project_id':'mangadistrict-com-title-stupidemic-uncensored','chapter_id':'ch-200c8c840df0','lease_id':'chapter-lane-stupidemic-ch1-r009-014-g1','fencing_token':1,'branch':'chapter/stupidemic-ch1/r009-014/g1','context_version':'smoke:no-canonical-context','page_start':9,'page_end':14,'phase':'done','pages':pages,'qa':{'status':'accepted','notes':['Exact rendered assets are 720x5000 WebP and were visually checked before durable replay.','Page 13 retains the stylized source BEAM artwork with adjacent Vietnamese annotation LƯỜM to avoid destructive redraw.']},'task_proposals':[],'handoff_path':handoff_path}
          handoff={'status':'completed','task_id':result['task_id'],'lane_id':'stupidemic-ch1','range_id':'r009-014','lease_id':result['lease_id'],'fencing_token':1,'branch':result['branch'],'phase':'done','page_start':9,'page_end':14,'page_commit':page_commit,'result_path':result_path,'resume_page':15,'completed_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          Path(result_path).parent.mkdir(parents=True,exist_ok=True); Path(handoff_path).parent.mkdir(parents=True,exist_ok=True)
          Path(result_path).write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path(handoff_path).write_text(json.dumps(handoff,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git rm .github/workflows/range-stupidemic-r009-014-g1.yml
          git add work/results/chapter-stupidemic-ch1-r009-014-g1.json work/handoffs/chapter-stupidemic-ch1-r009-014-g1.json
          git commit -m "record stupidemic range 009-014 result"
          git push origin HEAD:chapter/stupidemic-ch1/r009-014/g1
