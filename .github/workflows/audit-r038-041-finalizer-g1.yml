name: Audit r038-041 for finalization g1

on:
  push:
    branches:
      - chapter/stupidemic-ch1/finalize/g1
    paths:
      - .github/workflows/audit-r038-041-finalizer-g1.yml

permissions:
  contents: read
  actions: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract exact durable pages
        run: |
          mkdir -p audit
          base=projects/mangadistrict-com-title-stupidemic-uncensored/chapters/ch-200c8c840df0/rendered
          for p in 038 039 040 041; do
            git show 9d2d0d7d73a0609f1f61d33bcfb5fc2b110ab3cd:$base/page-$p.webp > audit/page-$p.webp
            sha256sum audit/page-$p.webp
          done
      - name: Upload exact pages
        uses: actions/upload-artifact@v4
        with:
          name: finalizer-audit-r038-041
          path: audit
          retention-days: 1
